<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TF Couple</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <p class="label">T와 F 부부의 유튜브 공간</p>
    <h1>TF Couple</h1>
    <p class="description">
      논리형 T와 감성형 F가 살아가는 일상을 기록합니다.
    </p>

    <section id="videos" class="video-list"></section>
  </main>

  <script>
    async function loadVideos() {
      const response = await fetch('./data/videos.json');
      const videos = await response.json();

      document.getElementById('videos').innerHTML = videos.map(video => `
        <article class="card">
          <span>${video.category}</span>
          <h2>${video.title}</h2>
          <p>${video.summary}</p>
          <a href="${video.url}" target="_blank">영상 보기</a>
        </article>
      `).join('');
    }

    loadVideos();
  </script>
</body>
</html>
